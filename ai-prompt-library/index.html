<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI生图提示词库</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--line:#d9dee8;--text:#1f2937;--muted:#667085;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{height:100vh;display:grid;grid-template-columns:260px minmax(320px,1fr) minmax(320px,42vw)}.side{background:#111827;color:#e5e7eb;padding:16px;overflow:auto}.brand{font-size:20px;font-weight:800;margin:4px 0 16px}.count{color:#9ca3af;margin-bottom:14px}.cat{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;margin:4px 0;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left;cursor:pointer}.cat.active,.cat:hover{background:#243044}.badge{min-width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}.work{display:grid;grid-template-rows:auto 1fr;min-width:0}.top{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}input,textarea,button{font:inherit}#q{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:9px 10px}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.cards{overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;align-content:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}.card.active{outline:2px solid var(--accent)}.card h3{font-size:15px;margin:0 0 7px}.meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#f8fafc}.preview{margin-top:9px;color:#475467;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.detail{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto 1fr auto;min-width:0}.detailHead{padding:16px;border-bottom:1px solid var(--line)}.detailHead h2{margin:0 0 8px;font-size:20px}.detailMeta{color:var(--muted)}.detailTools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}#txt{width:100%;height:100%;border:0;resize:none;padding:16px;outline:0;white-space:pre-wrap}.status{min-height:38px;padding:9px 16px;color:var(--muted);border-top:1px solid var(--line)}.hidden{display:none}@media(max-width:900px){.app{height:auto;min-height:100vh;grid-template-columns:1fr}.side{max-height:240px}.detail{border-left:0;border-top:1px solid var(--line);min-height:520px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">AI生图提示词库</div><div class="count" id="count">正在加载...</div><div id="cats"></div></aside><main class="work"><div class="top"><input id="q" placeholder="搜索标题 / 分类 / 提示词"><button id="importBtn">导入 JSON</button><button id="exportBtn">导出 JSON</button><button id="syncBtn" class="primary">云同步</button><input class="hidden" id="file" type="file" accept="application/json,.json"></div><div class="cards" id="cards"></div></main><section class="detail"><div class="detailHead"><h2 id="title">选择一个提示词</h2><div class="detailMeta" id="meta"></div></div><div class="detailTools"><button id="copyBtn">复制正文</button><button id="saveBtn">保存修改</button><button id="resetBtn">恢复原文</button><button id="newBtn">新增卡片</button></div><textarea id="txt" placeholder="请先导入 JSON；修改会保存在本机，也可用云同步保存到 GitHub。"></textarea><div class="status" id="status"></div></section></div>
<script>
const STORE="ai_prompt_library_cloud_v1",CFG="ai_prompt_library_cloud_config_v1";let lib={version:4,categoryOrder:[],colors:{},icons:{},prompts:[]},items=[],cat="全部",selected=null;const $=s=>document.querySelector(s);const toast=t=>{$("#status").textContent=t;clearTimeout(window.__to);window.__to=setTimeout(()=>$("#status").textContent="",4200)};
function expand(x){return{id:x.id||crypto.randomUUID(),order:x.o||x.order||0,title:x.t||x.title||"未命名提示词",displayTitle:x.d||x.displayTitle||x.t||x.title||"未命名提示词",category:x.c||x.category||"其他",subcategory:x.s||x.subcategory||"自定义",icon:x.i||x.icon||"类",color:x.h||x.color||"#64748b",prompt:x.p||x.prompt||"",steps:Array.isArray(x.steps)?x.steps:[]}}
function compact(p){return{id:p.id,o:p.order,t:p.title,d:p.displayTitle,c:p.category,s:p.subcategory,i:p.icon,h:p.color,p:p.prompt,steps:p.steps}}
function normalize(data){const src=Array.isArray(data)?{prompts:data}:data||{};const prompts=(src.prompts||[]).map(expand);return{version:4,appVersion:src.appVersion||"v.004",exportedAt:new Date().toISOString(),total:prompts.length,categoryOrder:src.categoryOrder||[...new Set(prompts.map(p=>p.category))],colors:src.colors||{},icons:src.icons||{},prompts}}
function persist(){localStorage.setItem(STORE,JSON.stringify({...lib,prompts:items.map(compact),total:items.length,exportedAt:new Date().toISOString()}))}
function textOf(p){return p.prompt||(p.steps||[]).map(s=>s.prompt||"").join("\n\n")}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const q=$("#q").value.trim().toLowerCase();const cats=["全部",...lib.categoryOrder.filter(c=>items.some(p=>p.category===c))];$("#count").textContent=items.length?items.length+" 条提示词":"请导入 JSON";$("#cats").innerHTML=cats.map(c=>'<button class="cat '+(c===cat?'active':'')+'" data-cat="'+esc(c)+'"><span class="badge" style="background:'+(lib.colors[c]||"#64748b")+'">'+esc(lib.icons[c]||c.slice(0,1))+'</span><span>'+esc(c)+'</span></button>').join("");let list=items.filter(p=>(cat==="全部"||p.category===cat)&&(!q||[p.title,p.displayTitle,p.category,p.subcategory,p.prompt].join("\n").toLowerCase().includes(q)));$("#cards").innerHTML=list.map(p=>'<article class="card '+(selected&&selected.id===p.id?'active':'')+'" data-id="'+esc(p.id)+'"><h3>'+esc(p.displayTitle)+'</h3><div class="meta"><span class="pill">'+esc(p.category)+'</span><span class="pill">'+esc(p.subcategory)+'</span></div><div class="preview">'+esc(textOf(p).slice(0,260))+'</div></article>').join("")||'<div class="card">没有数据。请导入本地 JSON，或点云同步从 GitHub JSON 读取。</div>'}
function select(id){selected=items.find(p=>p.id===id);if(!selected)return;$("#title").textContent=selected.displayTitle;$("#meta").textContent=selected.category+" / "+selected.subcategory;$("#txt").value=textOf(selected);render()}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
async function gunzipBase64(b64){if(!window.DecompressionStream)throw Error("当前浏览器不支持解压数据块，请用最新版 Chrome/Edge");const bytes=Uint8Array.from(atob((b64||"").replace(/\s/g,"")),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(stream).text())}
async function readRemoteData(data){if(data&&data.encoding==="gzip-base64-chunks"&&Array.isArray(data.chunks)){const parts=await Promise.all(data.chunks.map(p=>fetch(p,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("数据块读取失败");return r.text()})));return gunzipBase64(parts.join(""))}return data}
async function importFile(file){if(!file)return;lib=normalize(JSON.parse(await file.text()));items=lib.prompts;persist();cat="全部";selected=null;render();if(items[0])select(items[0].id);toast("已导入 "+items.length+" 条")}
function b64enc(text){let s="",b=new TextEncoder().encode(text);b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
function b64dec(text){let s=atob((text||"").replace(/\n/g,""));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)))}
async function ghGet(cfg){const url="https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURIComponent(cfg.path).replace(/%2F/g,"/")+"?ref="+encodeURIComponent(cfg.branch||"main");const r=await fetch(url,{headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"}});if(r.status===404)return null;if(!r.ok)throw Error("云端读取失败");const j=await r.json();return{sha:j.sha,data:await readRemoteData(JSON.parse(b64dec(j.content)))}}
async function ghPut(cfg,payload,sha){const url="https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURIComponent(cfg.path).replace(/%2F/g,"/");const body={message:"Sync AI prompt library",branch:cfg.branch||"main",content:b64enc(JSON.stringify(payload,null,2))};if(sha)body.sha=sha;const r=await fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"},body:JSON.stringify(body)});if(!r.ok)throw Error("云端写入失败")}
async function cloud(){const old=JSON.parse(localStorage.getItem(CFG)||"{}");const repo=prompt("GitHub 仓库 owner/name",old.repo||"cw786230860-oss/my-web");if(!repo)return;const path=prompt("云端 JSON 路径",old.path||"ai-prompt-library/prompt-library.json")||"ai-prompt-library/prompt-library.json";const branch=prompt("分支",old.branch||"main")||"main";const token=prompt("GitHub Token，仅保存在本机浏览器",old.token||"");if(!token)return;const mode=(prompt("save 保存到云端；load 从云端读取","save")||"save").toLowerCase();const cfg={repo,path,branch,token};localStorage.setItem(CFG,JSON.stringify(cfg));try{if(mode==="load"){const remote=await ghGet(cfg);if(!remote){toast("云端文件不存在");return}lib=normalize(remote.data);items=lib.prompts;persist();render();if(items[0])select(items[0].id);toast("已从云端读取 "+items.length+" 条");return}const remote=await ghGet(cfg);await ghPut(cfg,{...lib,prompts:items.map(compact),total:items.length,exportedAt:new Date().toISOString()},remote&&remote.sha);toast("已保存到云端")}catch(e){toast(e.message||"云同步失败")}}
$("#cats").onclick=e=>{const b=e.target.closest(".cat");if(b){cat=b.dataset.cat;render()}};$("#cards").onclick=e=>{const c=e.target.closest(".card");if(c&&c.dataset.id)select(c.dataset.id)};$("#q").oninput=render;$("#importBtn").onclick=()=>$("#file").click();$("#file").onchange=e=>{importFile(e.target.files[0]);e.target.value=""};$("#exportBtn").onclick=()=>download("AI提示词库_v004_完整导出_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({...lib,prompts:items.map(compact),total:items.length},null,2));$("#syncBtn").onclick=cloud;$("#copyBtn").onclick=async()=>{if(!selected)return;await navigator.clipboard.writeText($("#txt").value);toast("已复制")};$("#saveBtn").onclick=()=>{if(!selected)return;selected.prompt=$("#txt").value;persist();render();toast("已保存到本机")};$("#resetBtn").onclick=()=>{if(!selected)return;$("#txt").value=textOf(selected);toast("已恢复当前卡片原文")};$("#newBtn").onclick=()=>{const title=prompt("标题");if(!title)return;const p={id:"local_"+Date.now(),order:items.length+1,title,displayTitle:title,category:cat==="全部"?"其他":cat,subcategory:"自定义",icon:"新",color:"#64748b",prompt:""};items.unshift(p);if(!lib.categoryOrder.includes(p.category))lib.categoryOrder.unshift(p.category);persist();select(p.id);toast("已新增")};
(async()=>{try{const local=localStorage.getItem(STORE);if(local){const saved=normalize(JSON.parse(local));if(saved.prompts.length){lib=saved;items=lib.prompts;render();if(items[0])select(items[0].id);return}}const r=await fetch("prompt-library.json",{cache:"no-store"});if(!r.ok)throw Error("云端 JSON 不可用");lib=normalize(await readRemoteData(await r.json()));items=lib.prompts;persist();render();if(items[0])select(items[0].id);toast("已加载云端 "+items.length+" 条提示词")}catch(e){render();toast("加载失败："+(e.message||e))}})();
</script>
</body>
</html>
